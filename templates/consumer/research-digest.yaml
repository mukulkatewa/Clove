apiVersion: clove/v1
kind: AgentTemplate
metadata:
  name: "research-digest"
  displayName: "Research Digest"
  description: "Researches any topic and produces a structured digest with key findings, trends, and recommendations."
  category: "research"
  author: "clove"
  version: "1.0.0"
  tags: ["research", "summarization", "analysis"]

spec:
  mode: "single"
  goal: "Research '{{topic}}' thoroughly. Produce a structured digest with: 1) Executive summary, 2) Key findings (5-8 points), 3) Current trends, 4) Actionable recommendations. Use multiple sources and cross-reference facts."
  model: "anthropic/claude-sonnet-4"
  budget: 0.50
  max_steps: 15
  tools: ["search", "http", "remember", "recall"]
  agent_name: "researcher"

parameters:
  - name: "topic"
    type: "string"
    label: "Research Topic"
    placeholder: "e.g., quantum computing startups in 2026"
    required: true
  - name: "depth"
    type: "select"
    label: "Research Depth"
    options: ["quick", "standard", "deep"]
    default: "standard"
    maps_to:
      quick: { max_steps: 5, budget: 0.15 }
      standard: { max_steps: 15, budget: 0.50 }
      deep: { max_steps: 30, budget: 1.50 }
