[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "clove-sdk"
version = "2.0.0"
description = "Python SDK for the CLOVE Agent Fleet Kernel"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CLOVE Team"}]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
